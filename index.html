<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rückenwind – Klima-Planer für Radtouren</title>
  <meta name="description" content="Zeigt für eine geplante mehrtägige Radtour die klimatologisch wahrscheinlichste Windrichtung, Sonnenstunden und Regenwahrscheinlichkeit – auf Basis von 10 Jahren Wetterhistorie." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <main class="app">

    <!-- 1. Header: nur der App-Name -->
    <header class="header">
      <span class="header__name">Rückenwind</span>
    </header>

    <!-- 2. + 3. Karten-Panel (Hero) mit Schwebe-Badge und Wind-Canvas -->
    <section class="map-panel">
      <div id="wind-badge" class="wind-badge" hidden>
        <svg class="wind-badge__icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path id="wind-badge-arrow" d="M12 3l5 9h-3.4v9h-3.2v-9H7l5-9z" fill="currentColor" />
        </svg>
        <span id="wind-badge-text"></span>
      </div>
      <div id="map" class="map-panel__map" aria-label="Karte mit Route"></div>
      <canvas id="wind-canvas" class="map-panel__canvas"></canvas>
      <div id="drop-hint" class="map-panel__drop-hint" hidden>GPX hier ablegen</div>
    </section>

    <!-- 4. Stat-Pills -->
    <section class="pills" aria-label="Klimastatistik">
      <button type="button" id="pill-wind-btn" class="pill pill--button"
              title="Windverteilung anzeigen">
        <svg class="pill__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 8h9a3 3 0 1 0-3-3M3 12h14a3 3 0 1 1-3 3M4 16h7a2.5 2.5 0 1 1-2.5 2.5"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span id="pill-wind" class="pill__value">–</span>
        <span class="pill__label">Wind aus</span>
      </button>
      <div class="pill">
        <svg class="pill__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span id="pill-sun" class="pill__value">–</span>
        <span class="pill__label">Sonne/Tag</span>
      </div>
      <div class="pill">
        <svg class="pill__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 3.5s6 6.6 6 11a6 6 0 1 1-12 0c0-4.4 6-11 6-11z"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        </svg>
        <span id="pill-rain" class="pill__value">–</span>
        <span class="pill__label">Regentage</span>
      </div>
    </section>

    <!-- 5. Eingabe-Panel -->
    <section class="input-panel">
      <div class="status">
        <span id="status-dot" class="status__dot"></span>
        <span id="status-text" class="status__text">Bereit</span>
      </div>

      <div class="field-row">
        <label class="field">
          <span class="field__label">Start</span>
          <input type="date" id="date-start" />
        </label>
        <label class="field">
          <span class="field__label">Ende</span>
          <input type="date" id="date-end" />
        </label>
      </div>

      <div class="button-row">
        <button type="button" id="btn-upload" class="btn">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M12 15V4m0 0L8 8m4-4l4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"
                  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          GPX laden
        </button>
        <input type="file" id="file-input" accept=".gpx" hidden />
        <button type="button" id="btn-draw" class="btn" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M4 20l4-1L19.5 7.5a2.1 2.1 0 0 0-3-3L5 16l-1 4z"
                  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          </svg>
          Route zeichnen
        </button>
      </div>

      <div class="button-row" id="draw-tools" hidden>
        <button type="button" id="btn-undo" class="btn btn--small">Letzten Punkt entfernen</button>
        <button type="button" id="btn-reset" class="btn btn--small">Zurücksetzen</button>
      </div>

      <div class="meta-row">
        <span id="route-length" class="meta-row__length"></span>
        <span id="period-hint" class="meta-row__hint"></span>
      </div>

      <p id="error-line" class="error-line" hidden></p>

      <button type="button" id="btn-analyze" class="cta" disabled>
        <span id="cta-spinner" class="cta__spinner" hidden></span>
        <span id="cta-label">Analysieren</span>
      </button>
    </section>

    <!-- Unterfenster: genaue Windverteilung als Kompass -->
    <div id="compass-modal" class="modal" hidden>
      <div id="compass-backdrop" class="modal__backdrop"></div>
      <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="compass-title">
        <div class="modal__head">
          <h2 id="compass-title" class="modal__title">Windverteilung</h2>
          <button type="button" id="compass-close" class="modal__close" aria-label="Schließen">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <p id="compass-subtitle" class="modal__subtitle"></p>
        <div id="compass-rose"></div>
        <p class="modal__note">Anteil der Tage nach Herkunftsrichtung des Windes</p>

        <div id="exposure-section" class="exposure" hidden>
          <div class="exposure__track" aria-hidden="true">
            <span id="exposure-seg-tail" class="exposure__seg exposure__seg--tail"></span>
            <span id="exposure-seg-cross" class="exposure__seg exposure__seg--cross"></span>
            <span id="exposure-seg-head" class="exposure__seg exposure__seg--head"></span>
          </div>
          <ul class="exposure__legend">
            <li><span class="exposure__dot exposure__dot--tail"></span>Rückenwind <b id="exposure-tail">–</b></li>
            <li><span class="exposure__dot exposure__dot--cross"></span>Neutral <b id="exposure-cross">–</b></li>
            <li><span class="exposure__dot exposure__dot--head"></span>Gegenwind <b id="exposure-head">–</b></li>
          </ul>
          <div class="exposure__flip">
            <span id="exposure-direction">Richtung: Start → Ziel</span>
            <button type="button" id="exposure-flip" class="btn btn--small">Umkehren</button>
          </div>
          <p class="modal__note">Netto-Schub je Streckenabschnitt – die Route auf der Karte ist entsprechend eingefärbt</p>
        </div>
      </div>
    </div>

  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
